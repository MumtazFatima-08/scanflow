<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#fbfaf6"/><defs><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e8e4da" stroke-width="1"/></pattern></defs><rect width="1200" height="700" fill="url(#g)"/><text x="600" y="62" text-anchor="middle" font-family="Arial" font-size="18" fill="#159a8b">ScanFlow</text><text x="600" y="105" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#27251f">The workflow behind a QR code</text><text x="600" y="138" text-anchor="middle" font-family="Arial" font-size="16" fill="#9a9079">So many QR codes get scanned every day — here’s the actual work that happens behind that one scan.</text><rect x="455" y="185" width="290" height="48" rx="12" fill="#fff" stroke="#c77a16"/><text x="600" y="216" text-anchor="middle" font-family="Arial" font-size="16" fill="#bd7110">▦  Generate a QR</text><rect x="350" y="270" width="500" height="58" rx="12" fill="#fff" stroke="#dfd6c5"/><text x="375" y="305" font-family="Arial" font-size="15" fill="#9b9078">What should this QR code point to?</text><rect x="350" y="350" width="155" height="42" rx="21" fill="#fff" stroke="#c77a16"/><text x="427" y="377" text-anchor="middle" font-family="Arial" font-size="14" fill="#bd7110">◎ Website / Link</text><rect x="520" y="350" width="145" height="42" rx="21" fill="#fff" stroke="#dfd6c5"/><text x="592" y="377" text-anchor="middle" font-family="Arial" font-size="14" fill="#665f52">▤ Form Link</text><rect x="680" y="350" width="165" height="42" rx="21" fill="#fff" stroke="#dfd6c5"/><text x="762" y="377" text-anchor="middle" font-family="Arial" font-size="14" fill="#665f52">@ Social / Account</text><rect x="350" y="420" width="500" height="120" rx="14" fill="#fff" stroke="#ddd5c5"/><text x="375" y="450" font-family="Arial" font-size="14" fill="#9b9078">Link</text><rect x="375" y="465" width="450" height="40" rx="7" fill="#f4f0e6" stroke="#ded5c3"/><text x="395" y="491" font-family="Arial" font-size="15" fill="#4c473d">mumtazz.netlify.app</text><rect x="375" y="520" width="175" height="40" rx="7" fill="#c27712"/><text x="462" y="546" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">Generate QR code</text></svg>